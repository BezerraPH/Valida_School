events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de rede
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream valida_backend {
        server valida-school:3000;
    }

    server {
        listen 80;
        server_name _;

        # Encaminhamento para o servidor Node / WebSocket
        location / {
            proxy_pass http://valida_backend;
            proxy_http_version 1.1;

            # Suporte a WebSocket em tempo real
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers de encaminhamento de IP real
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts adequados para WebSockets mantidos abertos
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

