services:
  valida-school:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valida_school_app
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/valida_school.db
      - TZ=America/Sao_Paulo
    volumes:
      - valida_school_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  valida-school-https:
    image: caddy:alpine
    container_name: valida_school_https
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-3443}:3443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - valida_school_caddy_data:/data
      - valida_school_caddy_config:/config
    depends_on:
      valida-school:
        condition: service_healthy

volumes:
  valida_school_data:
    name: valida_school_data
    driver: local
  valida_school_caddy_data:
    name: valida_school_caddy_data
  valida_school_caddy_config:
    name: valida_school_caddy_config
